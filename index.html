ouch-controls button:nth-child(1){grid-column:2;grid-row:1}.touch-controls button:nth-child(2){grid-column:1;grid-row:2}.touch-controls button:nth-child(3){grid-column:2;grid-row:2}.touch-controls button:nth-child(4){grid-column:3;grid-row:2}.modal{position:fixed;inset:0;background:#050906bb;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:4}.modal[hidden]{display:none}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:22px;width:min(100%,390px);padding:22px;box-shadow:var(--shadow)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialog h2{margin:0;font-size:23px}.close{background:none;font-size:24px;color:var(--muted)}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.setting-row:last-of-type{border:0}.setting-row small{display:block;color:var(--muted);font-size:12px}.switch{background:#3b493e;border-radius:99px;width:47px;height:27px;padding:3px}.switch:after{content:"";display:block;width:21px;height:21px;border-radius:50%;background:white;transition:.15s}.switch.on{background:var(--green2)}.switch.on:after{transform:translateX(20px);background:#183018}.dialog select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 30px 7px 10px;font-size:14px}.danger{color:var(--red);background:transparent;border:1px solid #ff786966;padding:8px 12px;border-radius:9px;font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--green);color:#1a2b17;padding:10px 17px;border-radius:99px;font-weight:800;transition:.22s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}.light{color-scheme:light;--bg:#edf3e9;--panel:#fff;--panel2:#f4f7f0;--line:#d6e0d2;--text:#1d2a1f;--muted:#6c7d6c;--shadow:0 24px 70px #253b241e;background:radial-gradient(ellipse at 50% -20%,#d0e6c8 0,transparent 55%),var(--bg)}.light .game-shell{background:linear-gradient(145deg,#fff,#eff6eb);border-color:#cfddca}.light .board-wrap{border-color:#c8d8c2}.light .score-card{background:#fff9}
    @media(max-width:820px){.app{padding:16px 20px 24px}.topbar{margin-bottom:15px}.layout{grid-template-columns:1fr;gap:22px}.intro{padding:5px 0 0;display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:14px}.eyebrow,.intro h1,.intro p{grid-column:1}.intro h1{font-size:clamp(37px,9vw,54px);margin:9px 0}.intro p{font-size:14px}.score-card{grid-column:2;grid-row:1/4;margin:0 0 4px;padding:10px 12px}.mode-grid{grid-template-columns:repeat(5,1fr)}.mode{min-height:67px;padding:8px}.mode b{font-size:12px}.mode span{font-size:10px}.selection{margin-top:18px}.primary{max-width:420px}.game-shell{max-width:590px;width:100%;margin:auto}.touch-controls{display:grid}}
    @media(max-width:520px){.app{padding:12px 13px 20px}.topbar{margin-bottom:12px}.brand{font-size:17px}.brand-mark{width:34px;height:34px}.top-actions{gap:6px}.soft-button{padding:8px 10px;font-size:12px}.icon-button{width:37px;height:37px}.layout{gap:17px}.intro{grid-template-columns:1fr auto}.intro p{font-size:13px;max-width:30ch}.score-card{gap:7px;padding:8px 9px}.score-icon{font-size:18px}.score-card strong{font-size:16px}.mode-grid{grid-template-columns:repeat(3,1fr)}.mode{min-height:58px}.mode:nth-child(n+4){min-height:53px}.game-shell{padding:11px;border-radius:20px}.hud{padding-bottom:8px}.hud strong{font-size:17px}.hud small{font-size:10px}.game-name{margin-bottom:8px}.board-wrap{border-radius:11px}.board-foot{margin-top:10px}.status{font-size:11px}.board-actions button{padding:7px 9px}.touch-controls{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);margin-top:11px}}
    @media(max-width:360px){.intro h1{font-size:37px}.mode-grid{grid-template-columns:repeat(2,1fr)}.mode:nth-child(n+4){min-height:58px}}
  </style>

<body>
<main class="app" id="app">
  <header class="topbar"><div class="brand"><span class="brand-mark">⌁</span><span>蛇蛇俱乐部</span></div><div class="top-actions"><button class="soft-button" id="recordsBtn">🏆 <span id="recordLabel">本地纪录</span></button><button class="icon-button" id="settingsBtn" aria-label="设置">⚙</button></div></header>
  <div class="layout">
    <section class="intro">
      <div class="eyebrow">SNAKE CLUB · DAILY PLAY</div><h1>今天，<br>吃点好的。</h1><p>转个弯，吃颗果子。经典老游戏，换个轻松的方式再玩一次。</p>
      <div class="score-card"><span class="score-icon">🏆</span><span><small>个人最佳</small><strong id="bestScore">0</strong></span></div>
      <div class="selection"><p class="section-label">选择一个玩法</p><div class="mode-grid" id="modeGrid"></div><button class="primary" id="startBtn">开始游戏</button><div class="keys"><span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span> 移动 <span class="key">空格</span> 暂停</div></div>
    </section>
    <section class="game-shell" aria-label="游戏区域">
      <div class="hud"><div class="hud-item"><small>本局得分</small><strong id="score">000</strong></div><div class="hud-item"><small>最高纪录</small><strong id="hudBest">000</strong></div><div class="hud-item"><small id="metricLabel">速度</small><strong id="metric">1.0×</strong></div></div>
      <div class="game-name" id="gameModeName">经典模式 · 慢慢来，吃到就是赚到</div>
      <div class="board-wrap" id="boardWrap"><canvas id="board" aria-label="贪吃蛇游戏棋盘"></canvas><div class="overlay" id="overlay"><div class="overlay-card"><div class="emoji">🐍</div><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayText">选择玩法，然后开始你的第一局。</p><button id="overlayBtn">开始游戏</button></div></div></div>
      <div class="board-foot"><div class="status"><i></i><span id="statusText">等待开局</span></div><div class="board-actions"><button id="pauseBtn">Ⅱ 暂停</button><button id="restartBtn">↻ 重开</button></div></div>
      <div class="touch-controls" aria-label="触屏方向控制"><button data-dir="up" aria-label="向上">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div>
    </section>
  </div>
</main>
<div class="modal" id="settingsModal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="dialog-head"><h2 id="settingsTitle">游戏设置</h2><button class="close" id="closeSettings" aria-label="关闭">×</button></div>
  <div class="setting-row"><span>主题<small>选择你喜欢的游戏氛围</small></span><select id="themeSelect"><option value="dark">深色夜游</option><option value="light">清新浅色</option></select></div>
  <div class="setting-row"><span>音效<small>吃到食物与游戏结束提示</small></span><button class="switch on" id="soundSwitch" aria-label="切换音效"></button></div>
  <div class="setting-row"><span>棋盘网格<small>显示格线辅助判断距离</small></span><button class="switch on" id="gridSwitch" aria-label="切换网格"></button></div>
  <div class="setting-row"><span>本地纪录<small>最高分保存在当前浏览器</small></span><button class="danger" id="resetRecord">重置纪录</button></div>
</section></div><div class="toast" id="toast"></div>
<script>
(()=>{
  const $=id=>document.getElementById(id), canvas=$('board'),ctx=canvas.getContext('2d');
  const modes=[['classic','经典','撞墙结束'],['wrap','穿墙','环游棋盘'],['obstacle','障碍','躲开路障'],['timed','限时','60 秒冲分'],['rush','加速','越吃越快']];
  const descriptions={classic:'慢慢来，吃到就是赚到',wrap:'穿过边界，从另一侧继续',obstacle:'注意前方，障碍会逐渐增加',timed:'60 秒内尽可能多吃果子',rush:'越吃越快，挑战你的反应'};
  const storage={get(k,d){try{return JSON.parse(localStorage.getItem('snakeclub.'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('snakeclub.'+k,JSON.stringify(v))}catch{}}};
  let mode='classic',snake=[],dir={x:1,y:0},queued={x:1,y:0},food=null,obstacles=[],score=0,best=storage.get('best',{}),running=false,paused=false,timer=0,stepMs=155,remaining=60,gridOn=storage.get('grid',true),soundOn=storage.get('sound',true),theme=storage.get('theme','dark'),audio=null,toastTimer=0;
  const N=24; function cellSize(){return canvas.width/N} function setCanvas(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=canvas.width;draw()} new ResizeObserver(setCanvas).observe(canvas);
  function draw(){const w=canvas.width;if(!w)return;const s=w/N;ctx.fillStyle=theme==='light'?'#edf5e9':'#111a13';ctx.fillRect(0,0,w,w);if(gridOn){ctx.strokeStyle=theme==='light'?'#dce8d7':'#ffffff0b';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,w);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*s);ctx.lineTo(w,i*s);ctx.stroke()}}
    obstacles.forEach(p=>{ctx.fillStyle=theme==='light'?'#89978a':'#526255';rounded(p.x*s+2,p.y*s+2,s-4,s-4,s*.18);ctx.fill();ctx.fillStyle='#ffffff18';rounded(p.x*s+4,p.y*s+4,s-8,s*.24,s*.1);ctx.fill()});
    if(food){ctx.save();ctx.shadowColor=food.type==='star'?'#ffd166':'#ff7869';ctx.shadowBlur=s*.65;ctx.fillStyle=food.type==='star'?'#ffd166':'#ff7869';ctx.beginPath();ctx.arc((food.x+.5)*s,(food.y+.5)*s,s*.34,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#a5d36b';ctx.beginPath();ctx.ellipse((food.x+.65)*s,(food.y+.22)*s,s*.13,s*.08,-.7,0,Math.PI*2);ctx.fill();ctx.restore()}
    snake.forEach((p,i)=>{const inset=i===0?s*.09:s*.15;ctx.fillStyle=i===0?'#d4ff8c':(i%2?'#8fdf4e':'#a9ec63');if(i===0){ctx.shadowColor='#b8f36b';ctx.shadowBlur=s*.5}rounded(p.x*s+inset,p.y*s+inset,s-inset*2,s-inset*2,s*.27);ctx.fill();ctx.shadowBlur=0;if(i===0){ctx.fillStyle='#25401d';const ex=dir.x===1?.69:dir.x===-1?.31:.62,ey=dir.y===1?.69:dir.y===-1?.31:.31;ctx.beginPath();ctx.arc((p.x+ex)*s,(p.y+ey)*s,s*.055,0,7);ctx.arc((p.x+(dir.y? .38:.38))*s,(p.y+(dir.x? .38:.38))*s,s*.055,0,7);ctx.fill()}})
  }
  function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
  function randCell(){let p,n=0;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};n++}while(n<1000&&(snake.some(q=>q.x===p.x&&q.y===p.y)||obstacles.some(q=>q.x===p.x&&q.y===p.y)));return p}
  function spawnFood(){food=randCell()}
  function buildModes(){const g=$('modeGrid');g.innerHTML='';modes.forEach(([id,name,sub])=>{let b=document.createElement('button');b.className='mode'+(id===mode?' selected':'');b.innerHTML=`<b>${name}</b><span>${sub}</span>`;b.onclick=()=>{mode=id;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('gameModeName').textContent=name+'模式 · '+descriptions[id];$('metricLabel').textContent=id==='timed'?'剩余时间':'速度';if(!running)draw()};g.append(b)})}
  function start(){clearInterval(timer);snake=[{x:11,y:12},{x:10,y:12},{x:9,y:12}];dir=queued={x:1,y:0};score=0;elapsed=0;remaining=60;obstacles=[];if(mode==='obstacle')for(let i=0;i<12;i++)obstacles.push(randCell());spawnFood();running=true;paused=false;last=performance.now();$('overlay').classList.add('hidden');$('statusText').textContent='游戏进行中';$('pauseBtn').textContent='Ⅱ 暂停';sync();tickLoop();draw()}
  function tickLoop(){clearInterval(timer);stepMs=Math.max(62,155-Math.min(80,score*.8)-(mode==='rush'?Math.min(35,score*1.2):0));timer=setInterval(step,stepMs)}
  function step(){if(!running||paused)return;dir=queued;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(mode==='wrap'){head.x=(head.x+N)%N;head.y=(head.y+N)%N}else if(mode==='timed'){if(head.x<0||head.x>=N||head.y<0||head.y>=N){penalty();return}}else if(head.x<0||head.x>=N||head.y<0||head.y>=N){end(false);return}
    const eating=food&&head.x===food.x&&head.y===food.y,body=eating?snake:snake.slice(0,-1);if(body.some(p=>p.x===head.x&&p.y===head.y)||obstacles.some(p=>p.x===head.x&&p.y===head.y)){if(mode==='timed'){penalty();return}else{end(false);return}}
    snake.unshift(head);if(eating){score+=10;beep(540,.07);if(mode==='obstacle'&&score%40===0){const block=randCell();obstacles.push(block)}spawnFood();tickLoop()}else snake.pop();if(mode==='timed'){remaining-=stepMs/1000;if(remaining<=0){remaining=0;end(true);return}}sync();draw()}
  function penalty(){score=Math.max(0,score-5);snake=[{x:11,y:12},{x:10,y:12},{x:9,y:12}];dir=queued={x:1,y:0};remaining=Math.max(0,remaining-3);if(remaining===0){end(true);return}spawnFood();sync();draw();beep(180,.12)}
  function end(timeout){running=false;paused=false;clearInterval(timer);const prev=best[mode]||0,isRecord=score>prev;if(isRecord){best[mode]=score;storage.set('best',best);$('bestScore').textContent=score;$('hudBest').textContent=String(score).padStart(3,'0')}$('overlayTitle').textContent=timeout?'时间到！':(isRecord?'新纪录！':'游戏结束');$('overlayText').textContent=`本局得分 ${score} · ${isRecord?'刷新了个人最佳！':'再来一局，刷新纪录吧。'}`;$('overlayBtn').textContent='再来一局';$('overlay').classList.remove('hidden');$('statusText').textContent=timeout?'挑战结束':'本局结束';beep(isRecord?760:140,.18);sync()}
  function pause(){if(!running)return;paused=!paused;$('pauseBtn').textContent=paused?'▶ 继续':'Ⅱ 暂停';$('statusText').textContent=paused?'已暂停':'游戏进行中';if(paused){$('overlayTitle').textContent='休息一下';$('overlayText').textContent='准备好了就继续。';$('overlayBtn').textContent='继续游戏';$('overlay').classList.remove('hidden')}else $('overlay').classList.add('hidden')}
  function sync(){ $('score').textContent=String(score).padStart(3,'0');$('hudBest').textContent=String(best[mode]||0).padStart(3,'0');$('metric').textContent=mode==='timed'?`${Math.ceil(remaining)}s`:`${(155/Math.max(62,155-Math.min(80,score*.8)-(mode==='rush'?Math.min(35,score*1.2):0))).toFixed(1)}×`;$('bestScore').textContent=best[mode]||0 }
  function change(d){if(!running){return}if(d.x===-dir.x&&d.y===-dir.y)return;queued=d}
  function beep(freq,dur){if(!soundOn)return;try{audio??=new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
  function toggle(el,val,key){val=!val;el.classList.toggle('on',val);storage.set(key,val);return val}
  function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
  buildModes();$('gameModeName').textContent='经典模式 · '+descriptions.classic;sync();draw();
  $('startBtn').onclick=start;$('restartBtn').onclick=start;$('overlayBtn').onclick=()=>paused?pause():start();$('pauseBtn').onclick=pause;
  $('settingsBtn').onclick=()=>$('settingsModal').hidden=false;$('closeSettings').onclick=()=>$('settingsModal').hidden=true;$('settingsModal').onclick=e=>{if(e.target===$('settingsModal'))$('settingsModal').hidden=true};
  $('themeSelect').value=theme;document.body.classList.toggle('light',theme==='light');$('themeSelect').onchange=e=>{theme=e.target.value;storage.set('theme',theme);document.body.classList.toggle('light',theme==='light');draw()};$('soundSwitch').classList.toggle('on',soundOn);$('gridSwitch').classList.toggle('on',gridOn);$('soundSwitch').onclick=()=>soundOn=toggle($('soundSwitch'),soundOn,'sound');$('gridSwitch').onclick=()=>{gridOn=toggle($('gridSwitch'),gridOn,'grid');draw()};$('resetRecord').onclick=()=>{best={};storage.set('best',best);sync();toast('本地纪录已重置')};$('recordsBtn').onclick=()=>{const names={classic:'经典',wrap:'穿墙',obstacle:'障碍',timed:'限时',rush:'加速'};toast(Object.keys(best).length?Object.entries(best).map(([k,v])=>`${names[k]} ${v}`).join(' · '):'还没有纪录，开始挑战吧！')};
  document.addEventListener('keydown',e=>{const key=e.key.toLowerCase(),dirs={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}};if(dirs[key]){e.preventDefault();change(dirs[key])}else if(key===' '){e.preventDefault();pause()}else if(key==='enter'&&!running)start()});
  document.querySelectorAll('.touch-controls button').forEach(b=>{const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};b.addEventListener('pointerdown',e=>{e.preventDefault();change(map[b.dataset.dir])})});let touchStart=null;$('boardWrap').addEventListener('touchstart',e=>{if(e.touches.length)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('boardWrap').addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>25)change(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});touchStart=null},{passive:true});
})();
</script>
